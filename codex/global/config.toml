# Generated from ~/.codex/config.toml by codex/scripts/sync_from_local.py.
# Provider configuration is excluded; sensitive values use ${ENV_NAME} placeholders.

disable_response_storage = true
model_reasoning_effort = "high"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
plan_mode_reasoning_effort = "high"
model = "gpt-5.6-sol"
service_tier = "default"
approvals_reviewer = "auto_review"
developer_instructions = """
Use the jessy-skills Codex workflow when appropriate. If the user invokes $project-workflow-codex, or asks for a project change in /root/hzx_mixlinker/jessy-skills, load and follow /root/.jessy-skills-codex/skills/project-workflow-codex/SKILL.md. Keep startup skill discovery small: project-workflow-codex and karpathy-guidelines are the entry skills; load domain skills from /root/.jessy-skills-codex/skills only after routing confirms they are relevant. Codex main owns routing, state, integration, and final verification; spawned Codex agents own only bounded tasks. Do not use Claude Workflow scripts. Do not rely on hooks or legacy hook-based orchestration plugins.

For library, framework, SDK, API, CLI tool, or cloud-service documentation questions, use Context7 before answering: run `npx ctx7@latest library <official name> \"<full user question>\"`, choose the best /org/project ID, then run `npx ctx7@latest docs <libraryId> \"<full user question>\"`. Use at most 3 Context7 commands per question and do not put secrets in queries.

For web research, prior search, crawling, page extraction, or site evidence tasks, prefer Firecrawl tools/skills when installed and relevant; otherwise use available search/browser tools and state the fallback. Keep source evidence explicit, distinguish facts from inference, and do not fabricate inaccessible results.

Postman MCP is configured as the `postman` MCP server for Postman workspace/API operations. Use it only when the user asks for Postman or API collection/environment work.
"""

